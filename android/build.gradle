apply plugin: 'com.android.library'

android {

    try {
        compileSdkVersion rootProject.ext.compileSdkVersion
    } catch (Exception e) {
        compileSdkVersion 35
    }
    namespace 'com.sensorsdata.analytics'
    defaultConfig {
        minSdkVersion 24
        try {
            targetSdkVersion rootProject.ext.targetSdkVersion
        } catch (Exception e) {
            targetSdkVersion 35
        }
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        // 单测直接跑 JVM:SALog 等 android.util.Log 调用返回默认值而非抛 "not mocked"
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // RN 0.88 起 react-native 坐标停发,改用 react-android
    compileOnly 'com.facebook.react:react-android'

    // 神策 Android SDK 6.5.1 module_core 源码已并入 src/main/java(原 compileOnly aar 已移除)
    // fork 扩展:AnalyticsMessages.sendHttpRequest 改为 SLS WebTracking 直传

    testImplementation 'junit:junit:4.13.2'
    // 单测里用真实 org.json 替换 android.jar 的 stub 实现
    testImplementation 'org.json:json:20231013'
}